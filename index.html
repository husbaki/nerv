<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { 
      margin: 0; 
      font-family: Arial, sans-serif;
      color: white;
      background-color: black;
      background-image: url(https://husbaki.github.io/nerv/assets/img/snowbackground.gif);
      background-position: center;
      background-attachment: fixed;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background:  linear-gradient(to bottom, rgba(69, 23, 23, 1), rgba(0, 0, 0, 0.351));
      padding: 15px 40px;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      height: 80px;
      box-sizing: border-box;
    }

    .navbar img {
      height: 60px;
    }

    .navbar-links {
      display: flex;
      gap: 25px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #ff004c; 
    }

    .content {
      padding-top: 120px; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
    }

    .box {
      background: rgb(101, 26, 26);
      padding: 40px;
      text-align: center;
      max-width: 900px;
      width: 80%;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    #app { 
      height: 400px; 
      width: 350px; 
      margin: auto; 
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img src="https://husbaki.github.io/nerv/assets/img/logo.svg" alt="logo">
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="music.html">Music</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>

  <div class="content">
    <div class="box">
      <h1>Добро пожаловать!</h1>
      <p>Это пример текста в центре страницы. Фон остаётся на месте, а этот блок можно скроллить.</p>
      <div id="app"></div>
    </div>
  </div>

  <script type="module">
    import Webamp from "https://unpkg.com/webamp@^2";
    const webamp = new Webamp({
      initialSkin: { url: "https://cdn.webampskins.org/skins/a582298ef38cdb431988d64ef0eef491.wsz" },
      initialTracks: [
        { metaData:{artist:"Evangelion",title:"Fly Me To The Moon"}, url:"https://husbaki.github.io/nerv/music/Evangelion-Fly_Me_To_The%20Moon.mp3", duration:271 },
        { metaData:{artist:"The Backseat Lovers",title:"Kilby Girl"}, url:"https://husbaki.github.io/nerv/music/The_Backseat_Lovers-Kilby_Girl.mp3", duration:282 },
        { metaData:{artist:"",title:"We Are Going To Eclecfunk Your Ass"}, url:"https://raw.githubusercontent.com/captbaritone/webamp-music/4b556fbf/Eclectek_-_02_-_We_Are_Going_To_Eclecfunk_Your_Ass.mp3", duration:190.093061 }
      ],
    });
    webamp.renderWhenReady(document.getElementById("app"));
  </script>
</body>
</html>
